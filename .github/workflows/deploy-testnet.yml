name: Deploy a testnet

# Despliega los contratos de TokenARG en Polygon Amoy y/o Ethereum Sepolia, guarda las
# direcciones en blockchain/deployments/<chainId>.json (las importa `npm run chain:sync` y el
# build de Vercel) y, si se pide, carga los datos de demo: rondas fondeadas y mercado abierto.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   DEPLOYER_PRIVATE_KEY   obligatoria: billetera con POL de Amoy y/o ETH de Sepolia para el gas
#                          (en este repo quedó cargada como DEPLOYES_PRIVATE_KEYS: sirven los dos nombres)
#   AMOY_RPC_URL           opcional: un RPC propio (Alchemy, Infura...). Si no está o no responde,
#   SEPOLIA_RPC_URL        se usa el primer RPC público que conteste con la red correcta.
# Variables (pestaña Variables), todas opcionales:
#   KYC_AGENT_ADDRESS      billetera del backend que da de alta inversores (por defecto, el deployer).
#                          Si es otra, el deploy le pasa un poco de gas en cada red.
#   TREASURY_ADDRESS, FEE_RECIPIENT_ADDRESS, ADMIN_ADDRESS, DOCS_BASE_URL
#
# Al final de cada corrida se revisa el deploy contra la cadena (scripts/verify-deployment.ts) y el
# resultado queda como avisos en la corrida. La acción "verificar" hace solo esa revisión.

on:
  workflow_dispatch:
    inputs:
      redes:
        description: "Redes"
        type: choice
        options: [sepolia, amoy, amoy-y-sepolia]
        default: sepolia
      accion:
        description: "Qué hacer"
        type: choice
        options: [desplegar, solo-datos-de-demo, verificar]
        default: desplegar
      demo:
        description: "Cargar datos de demo (ronda fondeada y órdenes en el mercado)"
        type: boolean
        default: true
      docs_base_url:
        description: "URL pública de los PDF. Vacío: la variable DOCS_BASE_URL o https://tokenarg.net.ar/docs"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.accion == 'desplegar' && 'Deploy' || inputs.accion == 'verificar' && 'Revisión' || 'Datos de demo' }} en ${{ matrix.red }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # De a una: cada red hace su propio commit con las direcciones.
      max-parallel: 1
      matrix:
        red: ${{ fromJSON(inputs.redes == 'amoy-y-sepolia' && '["amoy","sepolia"]' || format('["{0}"]', inputs.redes)) }}
    env:
      # El secret de este repo quedó cargado como DEPLOYES_PRIVATE_KEYS (un secret no se puede
      # renombrar): sirven los dos nombres.
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY || secrets.DEPLOYES_PRIVATE_KEYS }}
      # Vacíos si no hay secret: el paso "Elegir el RPC" pone uno público que responda.
      AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      KYC_AGENT_ADDRESS: ${{ vars.KYC_AGENT_ADDRESS }}
      TREASURY_ADDRESS: ${{ vars.TREASURY_ADDRESS }}
      FEE_RECIPIENT_ADDRESS: ${{ vars.FEE_RECIPIENT_ADDRESS }}
      ADMIN_ADDRESS: ${{ vars.ADMIN_ADDRESS }}
      DOCS_BASE_URL: ${{ inputs.docs_base_url || vars.DOCS_BASE_URL || 'https://tokenarg.net.ar/docs' }}
      WITH_DEMO: ${{ inputs.demo && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - name: Revisar la configuración
        id: config
        env:
          # Solo verdadero o falso: el valor de una variable se vería en los logs.
          KEY_AS_VARIABLE: ${{ vars.DEPLOYER_PRIVATE_KEY != '' || vars.DEPLOYES_PRIVATE_KEYS != '' }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            where="Settings → Secrets and variables → Actions → pestaña Secrets → New repository secret"
            if [ "$KEY_AS_VARIABLE" = "true" ]; then
              echo "::error title=La clave quedó cargada como variable::La clave privada está en la pestaña Variables, que no la protege. Borrala de ahí y creala en ${where}, con el nombre DEPLOYER_PRIVATE_KEY."
            elif [ -z "$KYC_AGENT_ADDRESS" ]; then
              echo "::error title=Falta el secret DEPLOYER_PRIVATE_KEY::El workflow no ve la clave ni la variable KYC_AGENT_ADDRESS. Seguramente quedaron dentro de un Environment (Settings → Environments), y de ahí no le llegan. Creá la clave en ${where} y la variable en la pestaña Variables → New repository variable."
            else
              echo "::error title=Falta el secret DEPLOYER_PRIVATE_KEY::El workflow ve la variable KYC_AGENT_ADDRESS pero no la clave. En la pestaña Secrets, bajo Repository secrets, tiene que haber uno llamado exactamente DEPLOYER_PRIVATE_KEY. Un secret no se puede renombrar: si el nombre está mal, creá otro en ${where} y borrá el viejo. Los secrets de un Environment, de Codespaces o de Dependabot no le llegan."
            fi
            exit 1
          fi
          key=$(echo "$DEPLOYER_PRIVATE_KEY" | tr -d '[:space:]')
          # MetaMask muestra la clave sin "0x": se acepta de las dos formas.
          if echo "$key" | grep -Eq '^[0-9a-fA-F]{64}$'; then key="0x$key"; fi
          if ! echo "$key" | grep -Eq '^0x[0-9a-fA-F]{64}$'; then
            echo "::error title=La clave no es válida::Lo que está cargado en el secret no es una clave privada: tienen que ser 64 caracteres hexadecimales (con o sin 0x adelante). En MetaMask: Detalles de la cuenta → Mostrar clave privada."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "DEPLOYER_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
      - name: Elegir el RPC
        id: rpc
        run: |
          case "${{ matrix.red }}" in
            amoy)
              var=AMOY_RPC_URL; want=0x13882
              public="https://polygon-amoy-bor-rpc.publicnode.com https://rpc-amoy.polygon.technology https://polygon-amoy.drpc.org" ;;
            sepolia)
              var=SEPOLIA_RPC_URL; want=0xaa36a7
              public="https://ethereum-sepolia-rpc.publicnode.com https://sepolia.drpc.org https://rpc.sepolia.org" ;;
          esac
          own="${!var:-}"
          tried=""
          for url in $own $public; do
            got=$(curl -sS -m 20 -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$url" 2>/dev/null | jq -r '.result // empty' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "${var}=${url}" >> "$GITHUB_ENV"
              if [ "$url" = "$own" ]; then echo "RPC: el del secret ${var}"; else echo "::notice title=RPC de ${{ matrix.red }}::${url}"; fi
              exit 0
            fi
            if [ "$url" = "$own" ]; then
              echo "::warning title=RPC de ${{ matrix.red }}::El RPC del secret ${var} no respondió con la red correcta. Pruebo con los públicos."
            else
              tried="${tried} ${url}"
            fi
          done
          echo "::error title=Sin RPC para ${{ matrix.red }}::Ningún RPC respondió con la red correcta (probé${tried}). Suele ser una caída momentánea: volvé a correr el workflow en unos minutos o cargá un RPC propio en el secret ${var}."
          exit 1
      - run: npm ci
        working-directory: blockchain
      - name: Saldo para el gas
        if: inputs.accion == 'desplegar'
        run: bash scripts/ci-run.sh "Saldo para el gas en ${{ matrix.red }}" npx hardhat run scripts/preflight.ts --network ${{ matrix.red }}
        working-directory: blockchain
      - name: Desplegar
        if: inputs.accion == 'desplegar'
        run: bash scripts/ci-run.sh "Deploy en ${{ matrix.red }}" npx hardhat run scripts/deploy.ts --network ${{ matrix.red }}
        working-directory: blockchain
      - name: Guardar las direcciones en el repo
        if: inputs.accion == 'desplegar'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockchain/deployments/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Deploy en ${{ matrix.red }}: direcciones de los contratos"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
      - name: Datos de demo (ronda fondeada y mercado abierto)
        if: (inputs.accion == 'desplegar' && inputs.demo) || inputs.accion == 'solo-datos-de-demo'
        run: bash scripts/ci-run.sh "Datos de demo en ${{ matrix.red }}" npx hardhat run scripts/seed-testnet.ts --network ${{ matrix.red }}
        working-directory: blockchain
      - name: Revisar el deploy contra la cadena
        if: ${{ !cancelled() && steps.rpc.outcome == 'success' }}
        run: |
          case "${{ matrix.red }}" in amoy) id=80002;; sepolia) id=11155111;; esac
          if [ ! -f "deployments/${id}.json" ]; then echo "Todavía no hay contratos desplegados en ${{ matrix.red }}."; exit 0; fi
          bash scripts/ci-run.sh "Revisión en ${{ matrix.red }}" npx hardhat run scripts/verify-deployment.ts --network ${{ matrix.red }}
        working-directory: blockchain
      - name: Resumen
        if: always()
        run: |
          case "${{ matrix.red }}" in amoy) id=80002; url=https://amoy.polygonscan.com;; sepolia) id=11155111; url=https://sepolia.etherscan.io;; esac
          file="blockchain/deployments/${id}.json"
          [ -f "$file" ] || { echo "Todavía no hay contratos desplegados en ${{ matrix.red }}." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const d = require(process.argv[1]); const url = process.argv[2];
            const a = (x) => `[\`${x}\`](${url}/address/${x})`;
            const lines = [`### Contratos en ${{ matrix.red }} (chainId ${d.chainId})`, "",
              `| Contrato | Dirección |`, `|---|---|`,
              `| IdentityRegistry | ${a(d.identityRegistry)} |`, `| P2PMarket | ${a(d.market.address)} |`,
              `| PaymentRouter | ${a(d.paymentRouter)} |`, `| USDC de prueba | ${a(d.paymentToken.address)} |`,
              ...Object.entries(d.projects).flatMap(([slug, p]) => [`| ${slug}: token | ${a(p.token)} |`, `| ${slug}: ronda | ${a(p.offering)} |`])];
            console.log(lines.join("\n"));
          ' "$PWD/$file" "$url" >> "$GITHUB_STEP_SUMMARY"
