name: CI

# Contratos, tipos, lint y build en cada push y pull request; además, la demo completa en dos
# redes locales (Polygon 31337 + Ethereum 31338) con la prueba de humo y las e2e de Playwright.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contratos:
    name: Contratos (Hardhat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
        working-directory: blockchain
      - run: npm test
        working-directory: blockchain
      - run: npm run typecheck
        working-directory: blockchain

  testnet:
    name: Deploy de testnet (ensayo en un nodo local)
    runs-on: ubuntu-latest
    needs: [contratos]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
        working-directory: blockchain
      - name: Nodo local con la fecha de hoy
        working-directory: blockchain
        run: |
          nohup npx hardhat node --port 8545 > node.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q result && exit 0
            sleep 1
          done
          cat node.log; exit 1
      - name: Deploy con las ventanas de testnet y datos de demo (dos veces, para probar que es idempotente)
        working-directory: blockchain
        run: |
          npx hardhat run scripts/preflight.ts --network localhost
          LIVE_WINDOWS=1 npx hardhat run scripts/deploy.ts --network localhost
          ALLOW_DEMO_SEED=1 npx hardhat run scripts/seed-testnet.ts --network localhost
          ALLOW_DEMO_SEED=1 npx hardhat run scripts/seed-testnet.ts --network localhost

  app:
    name: App (tipos, lint, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_NETWORK_MODE: local
      DATABASE_URL: postgresql://tokenarg:tokenarg@localhost:5432/tokenarg?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  demo:
    name: Demo de punta a punta (2 redes locales + e2e)
    runs-on: ubuntu-latest
    needs: [contratos, app]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokenarg
          POSTGRES_PASSWORD: tokenarg
          POSTGRES_DB: tokenarg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokenarg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_NETWORK_MODE: local
      DATABASE_URL: postgresql://tokenarg:tokenarg@localhost:5432/tokenarg?schema=public
      KYC_PROVIDER: mock
      ALLOW_MOCK_KYC: "true"
      # Cuenta #1 de los nodos locales de Hardhat: clave pública de prueba, solo sirve en local.
      KYC_AGENT_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      # Cuenta #9 de Hardhat (clave pública de prueba) como administradora del panel /admin.
      ADMIN_WALLETS: "0xa0Ee7A142d267C1f36714E4a8F75612F20a79720"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blockchain/package-lock.json
      - name: Secretos de esta corrida
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "KYC_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: blockchain
      - name: Base de datos
        run: npx prisma migrate deploy && npm run db:seed
      - name: Nodos locales (Polygon :8545 y Ethereum :8546)
        run: |
          nohup npm run chain:node > nodes.log 2>&1 &
          for i in $(seq 1 90); do
            a=$(curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 || true)
            b=$(curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8546 || true)
            if echo "$a" | grep -q result && echo "$b" | grep -q result; then echo "nodos listos en ${i}s"; exit 0; fi
            sleep 1
          done
          cat nodes.log; exit 1
      - name: Deploy + historia simulada + índice
        run: npm run demo:local
      - name: Build como en Vercel (migraciones, catálogo, sincronización y build)
        run: npm run vercel-build
      - name: App en http://localhost:3000
        run: |
          nohup npm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/api/auth/session && exit 0; sleep 1; done
          cat next.log; exit 1
      - name: Prueba de humo de la API
        run: npm run smoke
      - name: Alta de prueba como la del sitio publicado
        run: npx tsx scripts/live-check.ts
        env:
          BASE_URL: http://localhost:3000
      - name: Captación (postulaciones, lista de espera y panel)
        run: npx tsx scripts/growth-smoke.ts
        env:
          BASE_URL: http://localhost:3000
          ADMIN_TEST_KEY: "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
      - name: Navegador para las pruebas e2e
        # Las imágenes de GitHub ya traen las bibliotecas de Chrome, así que no hace falta apt
        # (--with-deps), que a veces se cuelga con el espejo de Ubuntu.
        timeout-minutes: 10
        run: npx playwright install chromium
      - name: Pruebas e2e (alta, inversión con USDC y ETH, mercado P2P, cartera, móvil)
        run: npm run test:e2e
      - name: Capturas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            e2e/screenshots/
            nodes.log
            next.log
          if-no-files-found: ignore
          retention-days: 7
