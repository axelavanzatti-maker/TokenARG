name: Publicar en Vercel

# Configura el proyecto de Vercel y publica la app sin entrar al panel (scripts/vercel-setup.mjs):
#   - variables de entorno: modo testnet, KYC simulado, la clave del agente KYC y, si faltan,
#     SESSION_SECRET y CRON_SECRET generados al azar (nunca se muestran);
#   - deploy de producción de main, esperando el resultado (si falla, el error queda como aviso);
#   - dominios tokenarg.net.ar y www.tokenarg.net.ar (redirige al principal), y si la delegación
#     en nic.ar ya apunta a Vercel;
#   - control del sitio: inicio, mercado, inicio de sesión y contratos importados de cada red.
# La acción "revisar" solo hace los dos últimos puntos sobre el último deploy de producción.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN           obligatorio: vercel.com → Account Settings → Tokens → Create
#   KYC_AGENT_PRIVATE_KEY  opcional: si no está y el agente KYC es la misma billetera que
#                          desplegó, se usa la clave del deployer
# Variables (pestaña Variables), opcionales: VERCEL_PROJECT (token-arg), APP_DOMAIN (tokenarg.net.ar)

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [configurar-y-publicar, revisar]
        default: configurar-y-publicar

permissions:
  contents: read

concurrency:
  group: vercel
  cancel-in-progress: false

jobs:
  vercel:
    name: ${{ inputs.accion == 'revisar' && 'Revisión' || 'Configurar y publicar' }} en Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vercel
        run: node scripts/vercel-setup.mjs
        env:
          ACCION: ${{ inputs.accion }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'token-arg' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'tokenarg.net.ar' }}
          AGENT_SECRET: ${{ secrets.KYC_AGENT_PRIVATE_KEY }}
          # El secret de este repo quedó como DEPLOYES_PRIVATE_KEYS (ver deploy-testnet.yml).
          DEPLOYER_SECRET: ${{ secrets.DEPLOYER_PRIVATE_KEY || secrets.DEPLOYES_PRIVATE_KEYS }}
